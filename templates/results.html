<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f4f8fc, #e2ecf5);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: fadeIn 1s ease-in-out;
        }

        .card h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 15px;
            color: #2c78d9;
        }

        .card p {
            font-size: 20px;
            font-weight: 500;
            margin: 20px 0;
            color: #555;
        }

        .btn {
            text-decoration: none;
            color: #ffffff;
            background-color: #2c78d9;
            border-radius: 10px;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 500;
            box-shadow: 0px 4px 10px rgba(44, 120, 217, 0.3);
            transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            background-color: #245eaa;
            box-shadow: 0px 6px 15px rgba(44, 120, 217, 0.5);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .card {
                padding: 30px;
                margin: 0 20px;
            }

            .card h1 {
                font-size: 26px;
            }

            .card p {
                font-size: 16px;
            }

            .btn {
                font-size: 16px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Prediction Result</h1>
        <p><strong>{{ prediction }}</strong></p>
        <a href="/" class="btn">Go Back</a>
    </div>
</body>
</html>
